# Claude Code driver bundle: use your local Claude Code subscription as a DSH main model.
# Install: dsh plugin --profile web add "github:anthony1x6000/dsh-claude-driver#main"
# Bundle wiring for `dsh plugin add` / registry installs.
#
# Mounting this plugin is inert on its own: it registers an llm adapter for the
# `claude-code` provider and only takes over a turn once a session actually
# selects that provider. Nothing is intercepted until you switch.
#
# No machine-specific values belong here. Set a proxy (needed when the outbound
# IP is a datacenter IP and Anthropic answers 403) in your own profile patch,
# not in the shipped manifest.
- insert:
    - id: claude-driver
      name: dsh-claude-driver
      # config:
      #   provider: claude-code       # the llm/stream route this adapter claims
      #   model: sonnet               # Claude model alias or full id
      #   maxTurns: 100
      #   usageStopPercent: 95         # stop all Claude turns at 95% of the 5-hour window
      #   weeklyStopPercent: 98        # same guard at 98% of the weekly window; false disables it
      #   usageStopCompaction: true    # compact the live Claude session once at that stop
      #   usageStopEndSession: true    # then end it: the next turn starts a fresh Claude session
      #   compactAtTokens: 0           # natively /compact once the context reaches N tokens; 0 = off
      #   nice: 19                    # lowest CPU priority for every Claude CLI process
      #   permissionMode: acceptEdits
      #   proxy: http://127.0.0.1:7897
